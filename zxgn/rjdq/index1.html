<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>软件大全 - 优质软件资源库</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            padding: 30px 0;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(106, 17, 203, 0.2);
        }
        
        h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            max-width: 700px;
            margin: 0 auto;
        }
        
        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 15px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        
        .software-table {
            width: 100%;
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            margin-bottom: 40px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        thead {
            background: linear-gradient(to right, #6a11cb, #2575fc);
            color: white;
        }
        
        th {
            padding: 18px 15px;
            text-align: left;
            font-weight: 600;
            user-select: none;
        }
        
        tbody tr {
            border-bottom: 1px solid #f1f1f1;
            transition: background-color 0.2s;
        }
        
        tbody tr:hover {
            background-color: #f8f9ff;
        }
        
        td {
            padding: 18px 15px;
        }
        
        .software-name {
            font-weight: 600;
            color: #2d3436;
        }
        
        .software-url a {
            color: #6a11cb;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 8px 15px;
            background-color: #f3f0ff;
            border-radius: 6px;
            transition: all 0.3s;
        }
        
        .software-url a:hover {
            background-color: #6a11cb;
            color: white;
        }
        
        .software-time {
            color: #636e72;
        }
        
        .link-icon {
            color: #00b894;
        }
        
        .footer {
            text-align: center;
            padding: 25px 0;
            color: #636e72;
            border-top: 1px solid #e1e5eb;
            margin-top: 20px;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #636e72;
        }
        
        .empty-state i {
            font-size: 4rem;
            margin-bottom: 20px;
            color: #dfe6e9;
        }
        
        .data-status {
            padding: 10px;
            text-align: center;
            font-style: italic;
            color: #636e72;
        }
        
        .load-more {
            text-align: center;
            padding: 20px;
            color: #6a11cb;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .load-more:hover {
            background-color: #f8f9ff;
        }
        
        .load-more.disabled {
            color: #b2bec3;
            cursor: not-allowed;
        }
        
        .load-more.disabled:hover {
            background-color: white;
        }
        
        .software-size {
            color: #636e72;
            font-size: 0.9rem;
        }
        
        .software-downs {
            color: #636e72;
            font-size: 0.9rem;
        }
        
        .password-badge {
            display: inline-block;
            background-color: #ffeaa7;
            color: #d63031;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            margin-top: 5px;
        }
        
        .config-info {
            background-color: #e8f5e9;
            border: 1px solid #c8e6c9;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            color: #2e7d32;
        }
        
        .error-info {
            background-color: #ffebee;
            border: 1px solid #ffcdd2;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            color: #c62828;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            
            h1 {
                font-size: 2.2rem;
            }
            
            th, td {
                padding: 12px 10px;
            }
            
            .software-table {
                overflow-x: auto;
                display: block;
            }
            
            .mobile-hidden {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-box-open"></i> 软件大全</h1>
            <p class="subtitle">收录各类优质软件资源，包含开发工具、实用程序、设计软件等，持续更新中</p>
        </header>
        
        <div class="config-info" id="configInfo">
            <strong>API信息：</strong> 正在使用新版蓝奏云API (lanzoum.com)
            <br><strong>文件夹ID：</strong> <span id="folderIdDisplay">8192989</span>
            <br><strong>用户ID：</strong> <span id="userIdDisplay">2128302</span>
        </div>
        
        <div class="error-info" id="errorInfo" style="display: none;"></div>
        
        <div class="stats">
            <div>共 <span id="totalCount">0</span> 个软件</div>
            <div>当前页数: <span id="currentPage">1</span></div>
            <div>状态: <span id="statusText">初始化...</span></div>
        </div>
        
        <div class="software-table">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>软件名称</th>
                        <th>下载链接</th>
                        <th>文件大小</th>
                        <th class="mobile-hidden">上传时间</th>
                        <th class="mobile-hidden">下载次数</th>
                    </tr>
                </thead>
                <tbody id="softwareTableBody">
                    <!-- 数据将通过JavaScript动态加载 -->
                    <tr id="loadingRow">
                        <td colspan="6" class="data-status">
                            <i class="fas fa-spinner fa-spin"></i> 正在加载软件数据...
                        </td>
                    </tr>
                </tbody>
            </table>
            
            <div id="emptyState" class="empty-state" style="display: none;">
                <i class="fas fa-box-open"></i>
                <h3>未找到软件数据</h3>
                <p>请检查网络连接或配置</p>
            </div>
            
            <div id="loadMoreBtn" class="load-more" style="display: none;">
                <i class="fas fa-chevron-down"></i> 点击加载更多
            </div>
        </div>
        
        <div class="footer">
            <p>© 2023 软件大全 | 本网站仅用于展示软件信息，请遵守软件许可协议</p>
            <p>数据来源: 蓝奏云(lanzoum.com) | 最后加载: <span id="loadTime"></span></p>
        </div>
    </div>

    <script>
        // 软件数据数组
        let softwareData = [];
        let currentPage = 1;
        let isLoading = false;
        let hasMoreData = true;
        
        // ============ 配置区域 ============
        // 根据你提供的请求信息配置
        
        // 文件夹ID
        const FOLDER_ID = "8192989";  // 对应的参数是 fid
        
        // 用户ID
        const UID = "2128302";  // 对应的参数是 uid
        
        // 网站域名 (根据referer判断)
        const LANZOU_DOMAIN = "https://ksyuchen.lanzoum.com";
        
        // API地址
        const API_URL = `${LANZOU_DOMAIN}/filemoreajax.php?file=${FOLDER_ID}`;
        
        // Cookie - 使用你提供的完整Cookie
        const COOKIE = "codelen=1; STDATA82=czst_eid%3D625511447-3821-%26ntime%3D3821; uz_distinctid=19bab74a10f120b-0538c514b87e42-4c657b58-146d15-19bab74a1101cc1; pc_ad1=1; Hm_lvt_f9e7d39e539f051a8255a697749f3468=1768108199,1769432787; acw_tc=dca76e2317695171262924357e3d5513577d06ff53e98764a6baa74eee; cdn_sec_tc=dca76e2317695171262924357e3d5513577d06ff53e98764a6baa74eee; Hm_lvt_fb7e760e987871d56396999d288238a4=1769512997,1769515404,1769515573,1769517127; HMACCOUNT=A4B5DD4772AF98B5; acw_sc__v2=6978b12fd7287c5f116a2ce82fed5bdfa5cc2ec8; Hm_lpvt_fb7e760e987871d56396999d288238a4=1769517686";
        
        // ============ 配置结束 ============
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 显示配置信息
            document.getElementById('folderIdDisplay').textContent = FOLDER_ID;
            document.getElementById('userIdDisplay').textContent = UID;
            
            // 初始加载软件数据
            loadSoftwareData(currentPage);
            
            // 加载更多按钮事件
            document.getElementById('loadMoreBtn').addEventListener('click', loadMoreSoftware);
            
            // 无限滚动监听
            window.addEventListener('scroll', handleScroll);
            
            // 显示当前时间
            document.getElementById('loadTime').textContent = new Date().toLocaleString('zh-CN');
            
            // 测试API连接
            testAPIConnection();
        });
        
        // 测试API连接
        async function testAPIConnection() {
            try {
                const testResponse = await fetch(API_URL, {
                    method: 'HEAD',
                    mode: 'no-cors'
                });
                updateStatus('API连接测试中...');
            } catch (error) {
                console.log('API连接测试完成');
            }
        }
        
        // 滚动到底部自动加载更多
        function handleScroll() {
            const { scrollTop, scrollHeight, clientHeight } = document.documentElement;
            const isAtBottom = scrollTop + clientHeight >= scrollHeight - 100;
            
            if (isAtBottom && !isLoading && hasMoreData) {
                loadMoreSoftware();
            }
        }
        
        // 生成请求参数
        function generateRequestParams(page) {
            // 根据你提供的参数生成
            const params = new URLSearchParams();
            
            // 固定参数
            params.append('lx', '2');  // lx=2
            params.append('fid', FOLDER_ID);  // 文件夹ID
            params.append('uid', UID);  // 用户ID
            params.append('pg', page.toString());  // 页码
            params.append('rep', '0');  // rep=0
            params.append('up', '1');  // up=1
            
            // 时间戳和签名 (可能需要动态生成)
            const timestamp = Math.floor(Date.now() / 1000);  // 当前时间戳
            params.append('t', timestamp.toString());  // 时间戳
            
            // 注意：k参数看起来像是一个签名，可能需要后端生成
            // 这里先用一个占位值，可能需要调整
            params.append('k', 'e431cc617bd7dad45afe5d5618fe083a');
            
            return params;
        }
        
        // 从API获取软件列表
        async function fetchSoftwareList(page) {
            // 生成请求参数
            const formData = generateRequestParams(page);
            
            // 构建请求头 - 使用你提供的headers
            const headers = {
                'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/144.0.0.0 Safari/537.36 Edg/144.0.0.0',
                'Accept': 'application/json, text/javascript, */*',
                'Accept-Encoding': 'gzip, deflate, br, zstd',
                'Content-Type': 'application/x-www-form-urlencoded',
                'sec-ch-ua-platform': '"Windows"',
                'x-requested-with': 'XMLHttpRequest',
                'sec-ch-ua': '"Not(A:Brand";v="8", "Chromium";v="144", "Microsoft Edge";v="144"',
                'sec-ch-ua-mobile': '?0',
                'origin': LANZOU_DOMAIN,
                'sec-fetch-site': 'same-origin',
                'sec-fetch-mode': 'cors',
                'sec-fetch-dest': 'empty',
                'referer': `${LANZOU_DOMAIN}/b02kvlrcj`,
                'accept-language': 'zh-CN,zh;q=0.9,en;q=0.8,en-GB;q=0.7,en-US;q=0.6',
                'priority': 'u=1, i',
                'Cookie': COOKIE
            };
            
            // 构建请求选项
            const requestOptions = {
                method: 'POST',
                headers: headers,
                body: formData.toString(),
                mode: 'cors',
                credentials: 'include'
            };
            
            console.log('正在请求API:', API_URL);
            console.log('请求参数:', formData.toString());
            console.log('请求头:', headers);
            
            try {
                const response = await fetch(API_URL, requestOptions);
                
                console.log('响应状态:', response.status, response.statusText);
                
                if (!response.ok) {
                    throw new Error(`HTTP错误: ${response.status} ${response.statusText}`);
                }
                
                const text = await response.text();
                console.log('原始响应:', text);
                
                try {
                    const data = JSON.parse(text);
                    console.log('解析成功:', data);
                    return data;
                } catch (jsonError) {
                    console.error('JSON解析错误:', jsonError);
                    
                    // 尝试处理可能的HTML响应
                    if (text.includes('登录') || text.includes('sign')) {
                        showError('Cookie可能已过期，请更新Cookie');
                    }
                    
                    throw new Error('服务器返回的数据格式不正确');
                }
            } catch (error) {
                console.error('获取软件列表失败:', error);
                
                // 检查是否是CORS错误
                if (error.message.includes('Failed to fetch') || error.message.includes('CORS')) {
                    showError('CORS错误: 浏览器阻止了跨域请求。请尝试:<br>1. 使用浏览器扩展禁用CORS<br>2. 或将网页部署到与API同域的服务器');
                }
                
                throw error;
            }
        }
        
        // 获取单个文件的下载链接 (需要根据实际情况调整)
        async function fetchDownloadLink(fileId, fileName) {
            // 蓝奏云新版的下载链接通常是固定的格式
            // https://[domain]/[fileId]?[参数]
            
            // 这里是一个示例，实际可能需要调用另一个API
            const downloadUrl = `${LANZOU_DOMAIN}/${fileId}`;
            
            // 模拟获取密码 (实际可能需要从另一个API获取)
            return {
                url: downloadUrl,
                password: null  // 大多数文件可能没有密码
            };
        }
        
        // 显示错误信息
        function showError(message) {
            const errorDiv = document.getElementById('errorInfo');
            errorDiv.innerHTML = `<strong>错误：</strong> ${message}`;
            errorDiv.style.display = 'block';
        }
        
        // 隐藏错误信息
        function hideError() {
            document.getElementById('errorInfo').style.display = 'none';
        }
        
        // 加载软件数据
        async function loadSoftwareData(page) {
            if (isLoading) return;
            
            isLoading = true;
            updateStatus(`正在加载第 ${page} 页...`);
            hideError();
            
            // 如果是第一页，显示加载提示
            if (page === 1) {
                const loadingRow = document.getElementById('loadingRow');
                if (loadingRow) loadingRow.style.display = 'table-row';
                document.getElementById('emptyState').style.display = 'none';
                document.getElementById('loadMoreBtn').style.display = 'none';
            } else {
                document.getElementById('loadMoreBtn').classList.add('disabled');
                document.getElementById('loadMoreBtn').innerHTML = '<i class="fas fa-spinner fa-spin"></i> 正在加载...';
            }
            
            try {
                const data = await fetchSoftwareList(page);
                
                // 移除加载提示
                if (page === 1) {
                    const loadingRow = document.getElementById('loadingRow');
                    if (loadingRow) loadingRow.style.display = 'none';
                }
                
                // 检查响应数据
                if (data && data.text && Array.isArray(data.text)) {
                    processSoftwareData(data.text, page);
                } else if (data && data.zt && data.zt === 1 && data.info && Array.isArray(data.info)) {
                    // 另一种可能的响应格式
                    processSoftwareData(data.info, page);
                } else if (data && Array.isArray(data)) {
                    // 直接是数组的情况
                    processSoftwareData(data, page);
                } else {
                    throw new Error('未知的响应格式');
                }
                
            } catch (error) {
                console.error('加载软件数据失败:', error);
                updateStatus(`加载失败: ${error.message}`);
                
                if (page === 1) {
                    document.getElementById('softwareTableBody').innerHTML = `
                        <tr>
                            <td colspan="6" class="data-status">
                                <i class="fas fa-exclamation-triangle"></i> 加载失败: ${error.message}
                                <br><small>请检查：</small>
                                <br><small>1. 网络连接</small>
                                <br><small>2. Cookie是否有效</small>
                                <br><small>3. 控制台查看详细错误</small>
                            </td>
                        </tr>
                    `;
                }
                
                document.getElementById('loadMoreBtn').style.display = 'none';
            } finally {
                isLoading = false;
            }
        }
        
        // 处理软件数据
        function processSoftwareData(dataArray, page) {
            if (dataArray.length === 0) {
                updateStatus(`第 ${page} 页没有数据`);
                
                if (page === 1) {
                    document.getElementById('emptyState').style.display = 'block';
                }
                
                hasMoreData = false;
                document.getElementById('loadMoreBtn').style.display = 'none';
                return;
            }
            
            updateStatus(`成功加载 ${dataArray.length} 个软件`);
            
            // 转换数据格式
            const newSoftware = dataArray.map(item => {
                // 根据不同的响应格式提取数据
                const software = {
                    id: item.id || item.f_id || Math.random().toString(36).substr(2, 9),
                    name: item.name_all || item.name || item.title || '未知文件',
                    fileId: item.id || item.f_id || '',
                    time: item.time || item.upload_time || '未知时间',
                    size: item.size || item.file_size || '未知大小',
                    downs: item.downs || item.down_count || item.downloads || 0,
                    ico: item.icon || item.file_type || null,
                    downloadUrl: null,
                    password: null
                };
                
                // 尝试从item中提取可能的下载信息
                if (item.url) {
                    software.downloadUrl = item.url;
                }
                if (item.pwd) {
                    software.password = item.pwd;
                }
                
                return software;
            });
            
            // 如果是第一页，替换数据；否则追加数据
            if (page === 1) {
                softwareData = newSoftware;
            } else {
                softwareData = [...softwareData, ...newSoftware];
            }
            
            // 更新页面显示
            document.getElementById('currentPage').textContent = page;
            document.getElementById('totalCount').textContent = softwareData.length;
            
            // 渲染表格
            renderSoftwareTable(softwareData);
            
            // 判断是否有更多数据 (假设每页固定数量)
            hasMoreData = dataArray.length >= 20;
            
            // 显示加载更多按钮
            if (hasMoreData) {
                document.getElementById('loadMoreBtn').style.display = 'block';
                document.getElementById('loadMoreBtn').classList.remove('disabled');
                document.getElementById('loadMoreBtn').innerHTML = '<i class="fas fa-chevron-down"></i> 点击加载更多';
            } else {
                document.getElementById('loadMoreBtn').style.display = 'none';
                updateStatus(`已加载全部 ${softwareData.length} 个软件`);
            }
        }
        
        // 更新状态文本
        function updateStatus(text) {
            const statusElement = document.getElementById('statusText');
            if (statusElement) {
                statusElement.textContent = text;
            }
        }
        
        // 加载更多软件
        async function loadMoreSoftware() {
            if (isLoading || !hasMoreData) return;
            
            currentPage++;
            await loadSoftwareData(currentPage);
        }
        
        // 渲染软件表格
        function renderSoftwareTable(data) {
            const tbody = document.getElementById('softwareTableBody');
            const emptyState = document.getElementById('emptyState');
            
            if (data.length === 0) {
                tbody.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }
            
            emptyState.style.display = 'none';
            
            let html = '';
            
            data.forEach(software => {
                // 构建链接HTML
                let linkHtml;
                if (software.downloadUrl) {
                    linkHtml = `
                        <a href="${software.downloadUrl}" target="_blank" rel="noopener noreferrer">
                            <i class="fas fa-external-link-alt link-icon"></i>
                            下载软件
                        </a>
                        ${software.password ? `<div class="password-badge">密码: ${software.password}</div>` : ''}
                    `;
                } else {
                    // 构建下载链接 (蓝奏云的标准格式)
                    const downloadUrl = `${LANZOU_DOMAIN}/${software.fileId || software.id}`;
                    linkHtml = `
                        <a href="${downloadUrl}" target="_blank" rel="noopener noreferrer" onclick="return confirmDownload(${software.id}, this);">
                            <i class="fas fa-download link-icon"></i>
                            下载文件
                        </a>
                        <div style="font-size: 0.8rem; color: #666; margin-top: 5px;">
                            可能需要密码
                        </div>
                    `;
                }
                
                // 格式化时间
                const formattedTime = formatTime(software.time);
                
                html += `
                    <tr>
                        <td>${software.id}</td>
                        <td class="software-name">
                            ${software.name}
                            ${software.ico ? `<br><small>类型: ${software.ico}</small>` : ''}
                        </td>
                        <td class="software-url">
                            ${linkHtml}
                        </td>
                        <td class="software-size">${software.size}</td>
                        <td class="software-time mobile-hidden">${formattedTime}</td>
                        <td class="software-downs mobile-hidden">${software.downs}</td>
                    </tr>
                `;
            });
            
            tbody.innerHTML = html;
        }
        
        // 格式化时间
        function formatTime(timeStr) {
            if (!timeStr || timeStr === '未知时间') return timeStr;
            
            // 尝试解析时间戳
            if (/^\d+$/.test(timeStr)) {
                const timestamp = parseInt(timeStr);
                const date = new Date(timestamp * 1000);
                return date.toLocaleDateString('zh-CN');
            }
            
            // 直接返回原字符串
            return timeStr;
        }
        
        // 确认下载 (可以在这里添加获取详细下载信息的逻辑)
        function confirmDownload(fileId, linkElement) {
            // 可以在这里添加获取密码等额外信息的逻辑
            return true; // 允许跳转
        }
        
        // 获取单个软件的下载链接
        async function getDownloadLink(fileId, buttonElement) {
            if (buttonElement.classList.contains('loading')) return;
            
            buttonElement.classList.add('loading');
            buttonElement.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 获取中...';
            
            try {
                // 这里需要根据实际情况实现
                const downloadInfo = await fetchDownloadLink(fileId);
                
                if (downloadInfo && downloadInfo.url) {
                    buttonElement.classList.remove('loading');
                    buttonElement.outerHTML = `
                        <a href="${downloadInfo.url}" target="_blank" rel="noopener noreferrer">
                            <i class="fas fa-external-link-alt link-icon"></i>
                            下载软件
                        </a>
                        ${downloadInfo.password ? `<div class="password-badge">密码: ${downloadInfo.password}</div>` : ''}
                    `;
                } else {
                    throw new Error('未获取到下载链接');
                }
            } catch (error) {
                console.error('获取下载链接失败:', error);
                buttonElement.classList.remove('loading');
                buttonElement.innerHTML = '<i class="fas fa-exclamation-circle"></i> 获取失败';
                
                setTimeout(() => {
                    buttonElement.innerHTML = '<i class="fas fa-sync-alt"></i> 获取链接';
                }, 3000);
            }
        }
    </script>
</body>
