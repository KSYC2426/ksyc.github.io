<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI图片生成器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(90deg, #4b6cb7 0%, #182848 100%);
            color: white;
            padding: 25px 30px;
            text-align: center;
        }
        
        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 1rem;
            opacity: 0.8;
        }
        
        .content {
            display: flex;
            flex-wrap: wrap;
            padding: 0;
        }
        
        .form-section {
            flex: 1;
            min-width: 300px;
            padding: 30px;
            background-color: #f9fafc;
            border-right: 1px solid #eaeaea;
        }
        
        .preview-section {
            flex: 1;
            min-width: 300px;
            padding: 30px;
            display: flex;
            flex-direction: column;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #444;
        }
        
        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            transition: all 0.3s;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #4b6cb7;
            box-shadow: 0 0 0 3px rgba(75, 108, 183, 0.2);
        }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .checkbox-group input {
            width: auto;
        }
        
        button {
            background: linear-gradient(90deg, #4b6cb7 0%, #182848 100%);
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            margin-top: 10px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            background: #cccccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .preview-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px dashed #ddd;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            min-height: 300px;
            background-color: #f9fafc;
        }
        
        .preview-placeholder {
            text-align: center;
            color: #888;
        }
        
        .preview-placeholder i {
            font-size: 3rem;
            margin-bottom: 15px;
            color: #c3cfe2;
        }
        
        .generated-image {
            max-width: 100%;
            max-height: 400px;
            border-radius: 6px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            display: none;
        }
        
        .image-info {
            width: 100%;
            background-color: #f0f4ff;
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
            display: none;
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        
        .info-row:last-child {
            margin-bottom: 0;
        }
        
        .info-label {
            font-weight: 600;
            color: #555;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            border-top: 4px solid #4b6cb7;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error-message {
            display: none;
            background-color: #ffe6e6;
            color: #d32f2f;
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
            text-align: center;
        }
        
        .gallery-controls {
            display: none;
            justify-content: space-between;
            width: 100%;
            margin-top: 15px;
        }
        
        .gallery-btn {
            width: 48%;
            padding: 10px;
            background: #4b6cb7;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .gallery-btn:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }
        
        .image-counter {
            text-align: center;
            margin-top: 10px;
            font-weight: 600;
            color: #555;
        }
        
        footer {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 0.9rem;
            border-top: 1px solid #eaeaea;
        }
        
        @media (max-width: 768px) {
            .content {
                flex-direction: column;
            }
            
            .form-section {
                border-right: none;
                border-bottom: 1px solid #eaeaea;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>AI图片生成器</h1>
            <p class="subtitle">基于深度学习的智能图像生成技术</p>
        </header>
        
        <div class="content">
            <div class="form-section">
                <form id="imageForm">
                    <div class="form-group">
                        <label for="prompt">提示词 (必填)</label>
                        <input type="text" id="prompt" placeholder="例如：猫娘" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="style">图片风格</label>
                        <select id="style">
                            <option value="100">智能匹配</option>
                            <option value="1">现代都市</option>
                            <option value="2">古风武侠</option>
                            <option value="3">水墨国风</option>
                            <option value="4">梦幻异世</option>
                            <option value="5">现代日漫</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="size">图片尺寸</label>
                        <select id="size">
                            <option value="1">1080×1080 (正方形)</option>
                            <option value="2" selected>1080×1512 (竖版)</option>
                            <option value="3">1080×1920 (手机壁纸)</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <div class="checkbox-group">
                            <input type="checkbox" id="enhance" checked>
                            <label for="enhance">智能补充提示词</label>
                        </div>
                    </div>
                    
                    <button type="submit" id="generateBtn">生成图片</button>
                </form>
                
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p>AI正在创作中，请稍候...</p>
                </div>
                
                <div class="error-message" id="errorMessage"></div>
            </div>
            
            <div class="preview-section">
                <div class="preview-container" id="previewContainer">
                    <div class="preview-placeholder" id="previewPlaceholder">
                        <i>🖼️</i>
                        <p>生成的图片将显示在这里</p>
                    </div>
                    <img src="" alt="生成的图片" class="generated-image" id="generatedImage">
                </div>
                
                <div class="gallery-controls" id="galleryControls">
                    <button class="gallery-btn" id="prevBtn">上一张</button>
                    <button class="gallery-btn" id="nextBtn">下一张</button>
                </div>
                
                <div class="image-counter" id="imageCounter"></div>
                
                <div class="image-info" id="imageInfo">
                    <div class="info-row">
                        <span class="info-label">宽度:</span>
                        <span id="infoWidth">-</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">高度:</span>
                        <span id="infoHeight">-</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">提示词:</span>
                        <span id="infoPrompt">-</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">图片链接:</span>
                        <a href="#" target="_blank" id="infoUrl">查看原图</a>
                    </div>
                </div>
            </div>
        </div>
        
        <footer>
            <p>© 2025 AI图片生成器 | 基于深度求索AI技术</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('imageForm');
            const generateBtn = document.getElementById('generateBtn');
            const loading = document.getElementById('loading');
            const errorMessage = document.getElementById('errorMessage');
            const previewPlaceholder = document.getElementById('previewPlaceholder');
            const generatedImage = document.getElementById('generatedImage');
            const imageInfo = document.getElementById('imageInfo');
            const infoWidth = document.getElementById('infoWidth');
            const infoHeight = document.getElementById('infoHeight');
            const infoPrompt = document.getElementById('infoPrompt');
            const infoUrl = document.getElementById('infoUrl');
            const galleryControls = document.getElementById('galleryControls');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const imageCounter = document.getElementById('imageCounter');
            
            let currentImages = [];
            let currentIndex = 0;
            
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                // 获取表单数据
                const prompt = document.getElementById('prompt').value;
                const style = document.getElementById('style').value;
                const size = document.getElementById('size').value;
                const enhance = document.getElementById('enhance').checked;
                
                // 验证必填字段
                if (!prompt.trim()) {
                    showError('提示词不能为空');
                    return;
                }
                
                // 显示加载状态
                showLoading();
                
                try {
                    // 准备请求参数
                    const params = new URLSearchParams();
                    params.append('prompt', prompt);
                    params.append('style', style);
                    params.append('Size', size);
                    params.append('1]m', enhance);
                    params.append('type', 'json');
                    
                    // 发送API请求
                    const response = await fetch('https://oiapi.net/api/AiDrawImage', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded',
                        },
                        body: params
                    });
                    
                    if (!response.ok) {
                        throw new Error(`HTTP错误: ${response.status}`);
                    }
                    
                    const data = await response.json();
                    
                    // 检查API返回状态
                    if (data.code !== 1) {
                        throw new Error(data.message || 'API返回错误');
                    }
                    
                    // 显示生成的图片
                    if (data.data && data.data.length > 0) {
                        currentImages = data.data;
                        currentIndex = 0;
                        displayImage(currentImages[currentIndex]);
                        updateGalleryControls();
                    } else {
                        throw new Error('未生成图片数据');
                    }
                    
                } catch (error) {
                    console.error('生成图片时出错:', error);
                    showError(`生成图片失败: ${error.message}`);
                } finally {
                    hideLoading();
                }
            });
            
            prevBtn.addEventListener('click', function() {
                if (currentIndex > 0) {
                    currentIndex--;
                    displayImage(currentImages[currentIndex]);
                    updateGalleryControls();
                }
            });
            
            nextBtn.addEventListener('click', function() {
                if (currentIndex < currentImages.length - 1) {
                    currentIndex++;
                    displayImage(currentImages[currentIndex]);
                    updateGalleryControls();
                }
            });
            
            function showLoading() {
                loading.style.display = 'block';
                generateBtn.disabled = true;
                errorMessage.style.display = 'none';
            }
            
            function hideLoading() {
                loading.style.display = 'none';
                generateBtn.disabled = false;
            }
            
            function showError(message) {
                errorMessage.textContent = message;
                errorMessage.style.display = 'block';
            }
            
            function displayImage(imageData) {
                // 隐藏占位符，显示图片
                previewPlaceholder.style.display = 'none';
                generatedImage.src = imageData.url;
                generatedImage.style.display = 'block';
                
                // 更新图片信息
                infoWidth.textContent = imageData.width;
                infoHeight.textContent = imageData.height;
                infoPrompt.textContent = imageData.prompt;
                infoUrl.href = imageData.url;
                imageInfo.style.display = 'block';
                
                // 更新计数器
                imageCounter.textContent = `${currentIndex + 1} / ${currentImages.length}`;
            }
            
            function updateGalleryControls() {
                if (currentImages.length > 1) {
                    galleryControls.style.display = 'flex';
                    prevBtn.disabled = currentIndex === 0;
                    nextBtn.disabled = currentIndex === currentImages.length - 1;
                } else {
                    galleryControls.style.display = 'none';
                }
            }
        });
    </script>
</body>
</html>
