<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网盘资源搜索 - 多平台资源一键搜索</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a237e 0%, #311b92 100%);
            color: #333;
            min-height: 100vh;
            padding-bottom: 30px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        header {
            text-align: center;
            padding: 40px 0 30px;
            color: white;
        }
        
        header h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            background: linear-gradient(to right, #ff9a9e, #fad0c4, #fad0c4, #a18cd1);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }
        
        header p {
            font-size: 1.1rem;
            opacity: 0.9;
            max-width: 700px;
            margin: 0 auto 20px;
            line-height: 1.6;
        }
        
        .search-box {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            margin-bottom: 40px;
            transition: transform 0.3s ease;
        }
        
        .search-box:hover {
            transform: translateY(-5px);
        }
        
        .search-form {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: flex-end;
        }
        
        .form-group {
            flex: 1;
            min-width: 250px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #444;
            font-size: 0.95rem;
        }
        
        .search-input {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1.1rem;
            transition: all 0.3s;
            background-color: #f9f9f9;
        }
        
        .search-input:focus {
            outline: none;
            border-color: #5c6bc0;
            background-color: white;
            box-shadow: 0 0 0 3px rgba(92, 107, 192, 0.2);
        }
        
        .cloud-types {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }
        
        .cloud-type-btn {
            padding: 10px 18px;
            background: #f0f0f0;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            color: #555;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .cloud-type-btn:hover {
            background: #e0e0e0;
            transform: translateY(-2px);
        }
        
        .cloud-type-btn.active {
            background: #5c6bc0;
            color: white;
            box-shadow: 0 4px 12px rgba(92, 107, 192, 0.3);
        }
        
        .search-btn {
            padding: 16px 36px;
            background: linear-gradient(to right, #5c6bc0, #3949ab);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 6px 20px rgba(92, 107, 192, 0.4);
        }
        
        .search-btn:hover {
            background: linear-gradient(to right, #3949ab, #303f9f);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(92, 107, 192, 0.5);
        }
        
        .search-btn:active {
            transform: translateY(0);
        }
        
        .loading {
            text-align: center;
            padding: 30px;
            display: none;
        }
        
        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #5c6bc0;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .results-container {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            display: none;
        }
        
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .results-header h2 {
            font-size: 1.8rem;
            color: #333;
        }
        
        .results-count {
            background: #e8eaf6;
            color: #3949ab;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.95rem;
        }
        
        .cloud-type-badge {
            display: inline-block;
            background: #5c6bc0;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 10px;
        }
        
        .results-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
        }
        
        .result-card {
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s;
            background: white;
        }
        
        .result-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            border-color: #c5cae9;
        }
        
        .result-image {
            height: 180px;
            width: 100%;
            object-fit: cover;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .result-content {
            padding: 20px;
        }
        
        .result-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
            line-height: 1.4;
        }
        
        .result-meta {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 0.85rem;
            color: #777;
        }
        
        .result-source {
            background: #f5f5f5;
            padding: 3px 10px;
            border-radius: 12px;
        }
        
        .result-date {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .result-actions {
            display: flex;
            gap: 10px;
        }
        
        .result-password {
            background: #fff3e0;
            color: #ef6c00;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.85rem;
            margin-bottom: 10px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        
        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn-primary {
            flex: 1;
            background: #5c6bc0;
            color: white;
            border: none;
        }
        
        .btn-primary:hover {
            background: #3949ab;
        }
        
        .btn-secondary {
            background: transparent;
            color: #5c6bc0;
            border: 1px solid #5c6bc0;
        }
        
        .btn-secondary:hover {
            background: #f0f2ff;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #777;
            grid-column: 1 / -1;
        }
        
        .empty-state i {
            font-size: 4rem;
            margin-bottom: 20px;
            color: #bdbdbd;
        }
        
        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }
        
        .empty-state p {
            font-size: 1.1rem;
            opacity: 0.8;
        }
        
        footer {
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 40px;
            font-size: 0.9rem;
        }
        
        .logo {
            font-size: 2rem;
            font-weight: 700;
            color: white;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        
        @media (max-width: 768px) {
            .search-form {
                flex-direction: column;
                align-items: stretch;
            }
            
            .form-group {
                min-width: 100%;
            }
            
            .search-btn {
                width: 100%;
                justify-content: center;
            }
            
            .results-list {
                grid-template-columns: 1fr;
            }
            
            header h1 {
                font-size: 2.2rem;
            }
        }
        
        .cloud-icon {
            font-size: 1.1rem;
        }
        
        .password-warning {
            color: #d32f2f;
            font-weight: 600;
        }
        
        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <i class="fas fa-cloud"></i> 网盘资源搜索
            </div>
            <h1>全网资源一键搜索</h1>
            <p>支持百度网盘、阿里云盘、夸克网盘、天翼云盘等主流网盘资源搜索，快速找到您需要的文件</p>
        </header>
        
        <main>
            <div class="search-box">
                <form id="searchForm" class="search-form">
                    <div class="form-group">
                        <label for="keyword"><i class="fas fa-search"></i> 搜索关键词</label>
                        <input 
                            type="text" 
                            id="keyword" 
                            class="search-input" 
                            placeholder="请输入要搜索的资源名称，如：仙逆、电影、软件..." 
                            value="仙逆"
                            required
                        >
                    </div>
                    
                    <div class="form-group">
                        <label><i class="fas fa-cloud"></i> 选择网盘类型</label>
                        <div class="cloud-types" id="cloudTypes">
                            <!-- 网盘类型按钮将通过JS动态生成 -->
                        </div>
                    </div>
                    
                    <button type="submit" class="search-btn">
                        <i class="fas fa-search"></i> 搜索资源
                    </button>
                </form>
            </div>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>正在搜索资源，请稍候...</p>
            </div>
            
            <div class="results-container" id="resultsContainer">
                <div class="results-header">
                    <h2>搜索结果</h2>
                    <div class="results-count" id="resultsCount">找到 0 个资源</div>
                </div>
                
                <div class="cloud-type-badge" id="currentCloudType">夸克网盘</div>
                
                <div id="errorContainer" style="display: none;">
                    <!-- 错误信息将在这里显示 -->
                </div>
                
                <div class="results-list" id="resultsList">
                    <!-- 搜索结果将通过JS动态生成 -->
                </div>
            </div>
        </main>
        
        <footer>
            <p>本网站仅提供资源搜索服务，所有资源均来自公开网络</p>
            <p>© 2023 网盘资源搜索 | API接口来自公开网络</p>
        </footer>
    </div>

    <script>
        // 网盘类型配置
        const cloudTypes = [
            { id: 'quark', name: '夸克网盘', icon: 'fas fa-bolt' },
            { id: 'baidu', name: '百度网盘', icon: 'fab fa-baidu' },
            { id: 'aliyun', name: '阿里云盘', icon: 'fas fa-cloud' },
            { id: 'tianyi', name: '天翼云盘', icon: 'fas fa-mobile-alt' },
            { id: 'uc', name: 'UC网盘', icon: 'fas fa-upload' },
            { id: 'mobile', name: '移动云盘', icon: 'fas fa-wifi' },
            { id: '115', name: '115网盘', icon: 'fas fa-hdd' },
            { id: 'pikpak', name: 'PikPak', icon: 'fas fa-box' },
            { id: 'xunlei', name: '迅雷网盘', icon: 'fas fa-bolt' },
            { id: '123', name: '123网盘', icon: 'fas fa-hashtag' },
            { id: 'magnet', name: '磁力链接', icon: 'fas fa-magnet' },
            { id: 'ed2k', name: '电驴链接', icon: 'fas fa-download' }
        ];

        // 网盘类型到API键的映射
        const cloudTypeToApiKey = {
            '115': '115',
            'quark': 'quark',
            'baidu': 'baidu',
            'aliyun': 'aliyun',
            'tianyi': 'tianyi',
            'uc': 'uc',
            'mobile': 'mobile',
            'pikpak': 'pikpak',
            'xunlei': 'xunlei',
            '123': '123',
            'magnet': 'magnet',
            'ed2k': 'ed2k'
        };

        // 当前选中的网盘类型
        let currentCloudType = 'quark';
        
        // 初始化网盘类型选择按钮
        function initCloudTypeButtons() {
            const container = document.getElementById('cloudTypes');
            
            cloudTypes.forEach(type => {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = `cloud-type-btn ${type.id === currentCloudType ? 'active' : ''}`;
                button.dataset.type = type.id;
                button.innerHTML = `
                    <i class="${type.icon} cloud-icon"></i>
                    ${type.name}
                `;
                
                button.addEventListener('click', () => {
                    document.querySelectorAll('.cloud-type-btn').forEach(btn => {
                        btn.classList.remove('active');
                    });
                    
                    button.classList.add('active');
                    currentCloudType = type.id;
                    
                    const typeName = cloudTypes.find(t => t.id === currentCloudType)?.name || currentCloudType;
                    document.getElementById('currentCloudType').textContent = typeName;
                });
                
                container.appendChild(button);
            });
        }
        
        // 格式化日期
        function formatDate(dateString) {
            if (!dateString || dateString === '0001-01-01T00:00:00Z') {
                return '未知日期';
            }
            
            try {
                const date = new Date(dateString);
                return date.toLocaleDateString('zh-CN', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });
            } catch (e) {
                return dateString;
            }
        }
        
        // 获取正确的API键
        function getApiKey(cloudType) {
            return cloudTypeToApiKey[cloudType] || cloudType;
        }
        
        // 显示错误信息
        function showError(message) {
            const errorContainer = document.getElementById('errorContainer');
            errorContainer.innerHTML = `
                <div class="error-message">
                    <i class="fas fa-exclamation-triangle"></i>
                    <span>${message}</span>
                </div>
            `;
            errorContainer.style.display = 'block';
        }
        
        // 隐藏错误信息
        function hideError() {
            document.getElementById('errorContainer').style.display = 'none';
        }
        
        // 显示搜索结果
        function displayResults(results, cloudType, total = 0) {
            const resultsList = document.getElementById('resultsList');
            const resultsCount = document.getElementById('resultsCount');
            const resultsContainer = document.getElementById('resultsContainer');
            const currentCloudTypeElement = document.getElementById('currentCloudType');
            
            // 隐藏错误信息
            hideError();
            
            // 更新结果数量
            resultsCount.textContent = `找到 ${total} 个资源`;
            
            // 更新当前网盘类型显示
            const typeName = cloudTypes.find(t => t.id === cloudType)?.name || cloudType;
            currentCloudTypeElement.textContent = typeName;
            
            // 清空现有结果
            resultsList.innerHTML = '';
            
            if (results.length === 0) {
                resultsList.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-search"></i>
                        <h3>未找到相关资源</h3>
                        <p>尝试更换关键词或选择其他网盘类型</p>
                    </div>
                `;
                resultsContainer.style.display = 'block';
                return;
            }
            
            // 生成结果卡片
            results.forEach(result => {
                const card = document.createElement('div');
                card.className = 'result-card';
                
                // 获取图片URL，如果有多个图片则取第一个
                const imageUrl = result.images && result.images.length > 0 
                    ? result.images[0] 
                    : `https://via.placeholder.com/400x200/5c6bc0/ffffff?text=${encodeURIComponent(result.note || '网盘资源')}`;
                
                // 处理备注，如果过长则截断
                const note = result.note || '未命名资源';
                const truncatedNote = note.length > 60 ? note.substring(0, 60) + '...' : note;
                
                // 检查是否有提取密码
                const hasPassword = result.password && result.password.trim() !== '';
                
                card.innerHTML = `
                    <img src="${imageUrl}" alt="${note}" class="result-image" onerror="this.src='https://via.placeholder.com/400x200/f0f0f0/666?text=图片加载失败'">
                    <div class="result-content">
                        <div class="result-title" title="${note}">${truncatedNote}</div>
                        ${hasPassword ? `
                            <div class="result-password">
                                <i class="fas fa-key"></i>
                                提取码: <span class="password-warning">${result.password}</span>
                            </div>
                        ` : ''}
                        <div class="result-meta">
                            <span class="result-source">${result.source || '未知来源'}</span>
                            <span class="result-date">
                                <i class="far fa-calendar"></i>
                                ${formatDate(result.datetime)}
                            </span>
                        </div>
                        <div class="result-actions">
                            <a href="${result.url}" target="_blank" class="btn btn-primary">
                                <i class="fas fa-external-link-alt"></i>
                                访问链接
                            </a>
                            <button class="btn btn-secondary copy-btn" data-url="${result.url}" data-password="${result.password || ''}">
                                <i class="far fa-copy"></i>
                                复制
                            </button>
                        </div>
                    </div>
                `;
                
                resultsList.appendChild(card);
            });
            
            // 为复制按钮添加事件监听器
            document.querySelectorAll('.copy-btn').forEach(button => {
                button.addEventListener('click', function() {
                    const url = this.dataset.url;
                    const password = this.dataset.password;
                    
                    // 如果有关联密码，一起复制
                    const textToCopy = password ? `${url}\n提取码: ${password}` : url;
                    
                    navigator.clipboard.writeText(textToCopy).then(() => {
                        const originalText = this.innerHTML;
                        this.innerHTML = '<i class="fas fa-check"></i> 已复制';
                        this.style.background = '#4caf50';
                        this.style.color = 'white';
                        this.style.borderColor = '#4caf50';
                        
                        setTimeout(() => {
                            this.innerHTML = originalText;
                            this.style.background = '';
                            this.style.color = '';
                            this.style.borderColor = '';
                        }, 2000);
                    });
                });
            });
            
            // 显示结果容器
            resultsContainer.style.display = 'block';
        }
        
        // 执行搜索
        async function performSearch(keyword, cloudType) {
            const loadingElement = document.getElementById('loading');
            const resultsContainer = document.getElementById('resultsContainer');
            
            // 显示加载动画
            loadingElement.style.display = 'block';
            resultsContainer.style.display = 'none';
            hideError();
            
            try {
                // 构建API URL
                const apiUrl = `https://wzapi.com/api/jhsj?cloud_types=${cloudType}&kw=${encodeURIComponent(keyword)}`;
                
                // 尝试从API获取数据
                const response = await fetch(apiUrl, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json',
                    },
                    mode: 'cors'
                });
                
                if (response.ok) {
                    const data = await response.json();
                    
                    if (data.code === 0) {
                        // API返回成功
                        if (data.data && data.data.total > 0 && data.data.merged_by_type) {
                            // 获取正确的API键
                            const apiKey = getApiKey(cloudType);
                            
                            // 尝试获取对应网盘类型的数据
                            let results = [];
                            let total = data.data.total || 0;
                            
                            if (data.data.merged_by_type[apiKey]) {
                                // 直接获取数据
                                results = data.data.merged_by_type[apiKey];
                            } else if (cloudType === '115' && data.data.merged_by_type['115']) {
                                // 处理115网盘的特殊情况
                                results = data.data.merged_by_type['115'];
                            } else {
                                // 没有对应网盘类型的数据
                                results = [];
                            }
                            
                            // 显示结果
                            displayResults(results, cloudType, total);
                        } else {
                            // 没有找到数据
                            displayResults([], cloudType, 0);
                        }
                    } else {
                        // API返回了错误代码
                        showError(`API错误: ${data.message || '未知错误'}`);
                        displayResults([], cloudType, 0);
                    }
                } else {
                    // API请求失败
                    showError(`请求失败: HTTP ${response.status}`);
                    displayResults([], cloudType, 0);
                }
            } catch (error) {
                // 发生网络错误
                console.error('搜索过程中发生错误:', error);
                
                if (error.name === 'TypeError' && error.message.includes('Failed to fetch')) {
                    showError('网络连接错误，请检查网络连接或API地址');
                } else {
                    showError(`搜索失败: ${error.message}`);
                }
                
                displayResults([], cloudType, 0);
            } finally {
                // 隐藏加载动画
                loadingElement.style.display = 'none';
                
                // 滚动到结果区域
                document.getElementById('resultsContainer').scrollIntoView({ 
                    behavior: 'smooth',
                    block: 'start'
                });
            }
        }
        
        // 表单提交事件处理
        document.getElementById('searchForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const keyword = document.getElementById('keyword').value.trim();
            
            if (!keyword) {
                alert('请输入搜索关键词');
                document.getElementById('keyword').focus();
                return;
            }
            
            performSearch(keyword, currentCloudType);
        });
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            initCloudTypeButtons();
            
            // 初始显示空状态
            displayResults([], currentCloudType, 0);
        });
    </script>
</body>
</html>
