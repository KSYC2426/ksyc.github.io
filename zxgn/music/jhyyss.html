<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音乐搜索播放器</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #f0f0f0;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px 0;
        }
        
        h1 {
            font-size: 2.8rem;
            background: linear-gradient(90deg, #00b4db, #0083b0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #a0a0c0;
            font-size: 1.1rem;
        }
        
        .search-section {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
        
        .search-form {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .search-box {
            flex: 1;
            min-width: 300px;
            position: relative;
        }
        
        .search-box input {
            width: 100%;
            padding: 16px 20px;
            border: none;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .search-box input:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: #00b4db;
            box-shadow: 0 0 0 3px rgba(0, 180, 219, 0.2);
        }
        
        .platform-selector {
            display: flex;
            gap: 10px;
        }
        
        .platform-btn {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 50px;
            color: #c0c0e0;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }
        
        .platform-btn.active {
            background: #0083b0;
            color: white;
        }
        
        .search-btn {
            padding: 16px 30px;
            background: linear-gradient(90deg, #00b4db, #0083b0);
            border: none;
            border-radius: 50px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 131, 176, 0.4);
        }
        
        .results-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }
        
        @media (max-width: 900px) {
            .results-section {
                grid-template-columns: 1fr;
            }
        }
        
        .song-list {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            max-height: 600px;
            overflow-y: auto;
        }
        
        .song-list h2 {
            margin-bottom: 20px;
            color: #00b4db;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .song-item {
            display: flex;
            align-items: center;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 12px;
            background: rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .song-item:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(5px);
        }
        
        .song-item.active {
            background: rgba(0, 180, 219, 0.2);
            border-left: 4px solid #00b4db;
        }
        
        .song-cover {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
            margin-right: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        
        .song-info {
            flex: 1;
        }
        
        .song-name {
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 1.1rem;
        }
        
        .song-artist, .song-album {
            color: #a0a0c0;
            font-size: 0.9rem;
            margin-bottom: 2px;
        }
        
        .song-platform {
            display: inline-block;
            padding: 3px 10px;
            background: rgba(0, 180, 219, 0.2);
            border-radius: 20px;
            font-size: 0.8rem;
            margin-top: 5px;
        }
        
        .player-section {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
        
        .player-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
        }
        
        .player-header h2 {
            color: #00b4db;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .download-btn {
            padding: 10px 20px;
            background: linear-gradient(90deg, #4CAF50, #2E7D32);
            border: none;
            border-radius: 50px;
            color: white;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
        }
        
        .now-playing {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 25px;
        }
        
        .album-cover {
            width: 250px;
            height: 250px;
            border-radius: 15px;
            object-fit: cover;
            margin-bottom: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
        }
        
        .playing-info {
            text-align: center;
            width: 100%;
        }
        
        .playing-name {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 5px;
        }
        
        .playing-artist {
            font-size: 1.2rem;
            color: #a0a0c0;
            margin-bottom: 5px;
        }
        
        .playing-album {
            color: #8888aa;
            font-size: 1rem;
        }
        
        .player-controls {
            width: 100%;
            margin-top: 20px;
        }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            margin-bottom: 15px;
            cursor: pointer;
            overflow: hidden;
        }
        
        .progress {
            height: 100%;
            background: linear-gradient(90deg, #00b4db, #0083b0);
            width: 0%;
            border-radius: 3px;
            transition: width 0.1s;
        }
        
        .time-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            color: #a0a0c0;
            font-size: 0.9rem;
        }
        
        .control-buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin-bottom: 25px;
        }
        
        .control-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .control-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(1.1);
        }
        
        .play-btn {
            background: linear-gradient(90deg, #00b4db, #0083b0);
            font-size: 1.8rem;
            width: 70px;
            height: 70px;
        }
        
        .play-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 15px rgba(0, 180, 219, 0.4);
        }
        
        .lyrics-container {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            padding: 20px;
            height: 250px;
            overflow-y: auto;
            margin-top: 20px;
        }
        
        .lyrics-container h3 {
            color: #00b4db;
            margin-bottom: 15px;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .lyrics {
            line-height: 1.8;
            color: #d0d0f0;
            white-space: pre-wrap;
            text-align: center;
        }
        
        .lyrics-line.active {
            color: #00b4db;
            font-weight: 600;
            font-size: 1.1rem;
        }
        
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
        }
        
        .page-btn {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .page-btn:hover:not(:disabled) {
            background: rgba(0, 180, 219, 0.5);
        }
        
        .page-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .current-page {
            color: #00b4db;
            font-weight: 600;
            min-width: 30px;
            text-align: center;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #00b4db;
        }
        
        .loading.active {
            display: block;
        }
        
        .error-message {
            display: none;
            background: rgba(255, 50, 50, 0.1);
            border-left: 4px solid #ff5252;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            color: #ff9999;
        }
        
        .error-message.active {
            display: block;
        }
        
        footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: #8888aa;
            font-size: 0.9rem;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #8888aa;
        }
        
        .empty-state i {
            font-size: 3rem;
            margin-bottom: 15px;
            opacity: 0.5;
        }
        
        .auto-next {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
            color: #a0a0c0;
        }
        
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }
        
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 24px;
        }
        
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        
        input:checked + .toggle-slider {
            background-color: #00b4db;
        }
        
        input:checked + .toggle-slider:before {
            transform: translateX(26px);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-music"></i> 音乐搜索播放器</h1>
            <p class="subtitle">搜索并播放来自多个平台的音乐，支持在线播放和下载</p>
        </header>
        
        <main>
            <section class="search-section">
                <form class="search-form" id="searchForm">
                    <div class="search-box">
                        <input type="text" id="searchInput" placeholder="请输入歌曲名、歌手或专辑..." required>
                    </div>
                    
                    <div class="platform-selector">
                        <button type="button" class="platform-btn active" data-type="wy">网易云</button>
                        <button type="button" class="platform-btn" data-type="qq">QQ音乐</button>
                        <button type="button" class="platform-btn" data-type="kw">酷我音乐</button>
                        <button type="button" class="platform-btn" data-type="mg">咪咕音乐</button>
                        <button type="button" class="platform-btn" data-type="qi">其他</button>
                    </div>
                    
                    <button type="submit" class="search-btn">
                        <i class="fas fa-search"></i> 搜索音乐
                    </button>
                </form>
                
                <div class="auto-next">
                    <span>自动播放下一首:</span>
                    <label class="toggle-switch">
                        <input type="checkbox" id="autoNextToggle" checked>
                        <span class="toggle-slider"></span>
                    </label>
                </div>
            </section>
            
            <div class="loading" id="loading">
                <i class="fas fa-spinner fa-spin"></i> 正在加载中...
            </div>
            
            <div class="error-message" id="errorMessage">
                <i class="fas fa-exclamation-triangle"></i> <span id="errorText">发生错误，请稍后重试</span>
            </div>
            
            <div class="results-section" id="resultsSection">
                <div class="song-list">
                    <h2><i class="fas fa-list"></i> 搜索结果</h2>
                    <div id="songList">
                        <div class="empty-state">
                            <i class="fas fa-music"></i>
                            <p>输入关键词搜索音乐</p>
                        </div>
                    </div>
                    
                    <div class="pagination" id="pagination" style="display: none;">
                        <button class="page-btn" id="prevPage" disabled><i class="fas fa-chevron-left"></i> 上一页</button>
                        <span class="current-page" id="currentPage">1</span>
                        <button class="page-btn" id="nextPage" disabled>下一页 <i class="fas fa-chevron-right"></i></button>
                    </div>
                </div>
                
                <div class="player-section">
                    <div class="player-header">
                        <h2><i class="fas fa-play-circle"></i> 播放器</h2>
                        <button class="download-btn" id="downloadBtn" disabled>
                            <i class="fas fa-download"></i> 下载音乐
                        </button>
                    </div>
                    
                    <div class="now-playing">
                        <img src="https://picsum.photos/250/250?random=1" alt="专辑封面" class="album-cover" id="albumCover">
                        
                        <div class="playing-info">
                            <div class="playing-name" id="playingName">未选择歌曲</div>
                            <div class="playing-artist" id="playingArtist">-</div>
                            <div class="playing-album" id="playingAlbum">-</div>
                        </div>
                        
                        <div class="player-controls">
                            <div class="progress-bar" id="progressBar">
                                <div class="progress" id="progress"></div>
                            </div>
                            
                            <div class="time-info">
                                <span id="currentTime">00:00</span>
                                <span id="duration">00:00</span>
                            </div>
                            
                            <div class="control-buttons">
                                <button class="control-btn" id="prevBtn">
                                    <i class="fas fa-step-backward"></i>
                                </button>
                                
                                <button class="control-btn play-btn" id="playBtn">
                                    <i class="fas fa-play" id="playIcon"></i>
                                </button>
                                
                                <button class="control-btn" id="nextBtn">
                                    <i class="fas fa-step-forward"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="lyrics-container">
                        <h3><i class="fas fa-file-alt"></i> 歌词</h3>
                        <div class="lyrics" id="lyrics">
                            选择歌曲后歌词将显示在这里
                        </div>
                    </div>
                </div>
            </div>
        </main>
        
        <footer>
            <p>音乐搜索播放器 &copy; 2023 | 数据来源于公开API</p>
            <p>仅供学习交流使用，请勿用于商业用途</p>
        </footer>
    </div>
    
    <audio id="audioPlayer" preload="metadata"></audio>
    
    <script>
        // 全局变量
        let currentSongs = [];
        let currentPage = 1;
        let totalPages = 1;
        let limit = 10;
        let currentType = 'wy';
        let currentSongIndex = -1;
        let isAutoNext = true;
        let currentLyrics = [];
        let currentLyricIndex = 0;
        
        // DOM元素
        const searchForm = document.getElementById('searchForm');
        const searchInput = document.getElementById('searchInput');
        const platformBtns = document.querySelectorAll('.platform-btn');
        const songList = document.getElementById('songList');
        const albumCover = document.getElementById('albumCover');
        const playingName = document.getElementById('playingName');
        const playingArtist = document.getElementById('playingArtist');
        const playingAlbum = document.getElementById('playingAlbum');
        const audioPlayer = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const progressBar = document.getElementById('progressBar');
        const progress = document.getElementById('progress');
        const currentTime = document.getElementById('currentTime');
        const duration = document.getElementById('duration');
        const lyrics = document.getElementById('lyrics');
        const downloadBtn = document.getElementById('downloadBtn');
        const loading = document.getElementById('loading');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        const resultsSection = document.getElementById('resultsSection');
        const pagination = document.getElementById('pagination');
        const prevPageBtn = document.getElementById('prevPage');
        const nextPageBtn = document.getElementById('nextPage');
        const currentPageSpan = document.getElementById('currentPage');
        const autoNextToggle = document.getElementById('autoNextToggle');
        
        // 平台选择
        platformBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                platformBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentType = btn.getAttribute('data-type');
                
                // 如果已有搜索结果，重新搜索当前关键词
                if (searchInput.value.trim()) {
                    searchSongs(searchInput.value.trim(), currentType, 1);
                }
            });
        });
        
        // 搜索表单提交
        searchForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const query = searchInput.value.trim();
            if (query) {
                searchSongs(query, currentType, 1);
            }
        });
        
        // 自动播放下一首切换
        autoNextToggle.addEventListener('change', () => {
            isAutoNext = autoNextToggle.checked;
        });
        
        // 搜索歌曲
        async function searchSongs(query, type, page) {
            showLoading();
            hideError();
            
            try {
                const url = `https://api.jkyai.top/API/hqyyid.php?name=${encodeURIComponent(query)}&type=${type}&page=${page}&limit=${limit}`;
                const response = await fetch(url);
                const data = await response.json();
                
                hideLoading();
                
                if (data.code === 1) {
                    currentSongs = data.data;
                    currentPage = page;
                    totalPages = Math.ceil(data.data.length / limit) || 1;
                    
                    displaySongs(currentSongs);
                    updatePagination();
                    
                    if (currentSongs.length > 0) {
                        resultsSection.style.display = 'grid';
                        pagination.style.display = 'flex';
                    } else {
                        showNoResults();
                    }
                } else {
                    showError(data.msg || '搜索失败，请重试');
                }
            } catch (error) {
                hideLoading();
                showError('网络错误，请检查网络连接');
                console.error('搜索出错:', error);
            }
        }
        
        // 显示歌曲列表
        function displaySongs(songs) {
            songList.innerHTML = '';
            
            if (songs.length === 0) {
                songList.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-search"></i>
                        <p>未找到相关歌曲，请尝试其他关键词</p>
                    </div>
                `;
                return;
            }
            
            songs.forEach((song, index) => {
                const songItem = document.createElement('div');
                songItem.className = 'song-item';
                if (index === currentSongIndex) {
                    songItem.classList.add('active');
                }
                
                // 获取封面图片
                const coverUrl = song.pic_id ? 
                    `https://p3.music.126.net/${song.pic_id.substring(0, 1)}/${song.pic_id.substring(1)}.jpg?param=100y100` : 
                    'https://picsum.photos/60/60?random=' + index;
                
                songItem.innerHTML = `
                    <img src="${coverUrl}" alt="封面" class="song-cover" onerror="this.src='https://picsum.photos/60/60?random=${index}'">
                    <div class="song-info">
                        <div class="song-name">${song.name}</div>
                        <div class="song-artist">${song.artist}</div>
                        <div class="song-album">${song.album}</div>
                        <span class="song-platform">${getPlatformName(song.type)}</span>
                    </div>
                `;
                
                songItem.addEventListener('click', () => {
                    // 移除之前激活的歌曲
                    document.querySelectorAll('.song-item').forEach(item => {
                        item.classList.remove('active');
                    });
                    
                    // 激活当前歌曲
                    songItem.classList.add('active');
                    
                    // 播放歌曲
                    playSong(song, index);
                });
                
                songList.appendChild(songItem);
            });
        }
        
        // 播放歌曲
        async function playSong(song, index) {
            showLoading();
            currentSongIndex = index;
            
            try {
                // 获取歌曲详情
                const url = `https://api.jkyai.top/API/yyjhss.php?id=${song.id}&type=${song.type}`;
                const response = await fetch(url);
                const data = await response.json();
                
                hideLoading();
                
                if (data.code === 1) {
                    const songData = data.data;
                    
                    // 更新播放器信息
                    playingName.textContent = songData.name;
                    playingArtist.textContent = songData.artist;
                    playingAlbum.textContent = songData.album;
                    
                    // 更新专辑封面
                    albumCover.src = songData.pic || 
                        `https://p3.music.126.net/${songData.picid.substring(0, 1)}/${songData.picid.substring(1)}.jpg?param=250y250`;
                    albumCover.onerror = () => {
                        albumCover.src = 'https://picsum.photos/250/250?random=' + index;
                    };
                    
                    // 设置音频源
                    audioPlayer.src = songData.url;
                    
                    // 解析歌词
                    parseLyrics(songData.lrc);
                    
                    // 启用下载按钮
                    downloadBtn.disabled = false;
                    downloadBtn.onclick = () => downloadSong(songData);
                    
                    // 播放
                    audioPlayer.play();
                    playIcon.className = 'fas fa-pause';
                    
                    // 更新进度条和时长
                    audioPlayer.onloadedmetadata = () => {
                        duration.textContent = formatTime(audioPlayer.duration);
                    };
                } else {
                    showError(data.msg || '获取歌曲信息失败');
                }
            } catch (error) {
                hideLoading();
                showError('获取歌曲信息失败，请重试');
                console.error('获取歌曲信息出错:', error);
            }
        }
        
        // 解析歌词
        function parseLyrics(lrcText) {
            currentLyrics = [];
            currentLyricIndex = 0;
            
            if (!lrcText) {
                lyrics.innerHTML = '暂无歌词';
                return;
            }
            
            // 解析歌词行
            const lines = lrcText.split('\n');
            const lyricLines = [];
            
            lines.forEach(line => {
                // 匹配时间标签和歌词内容
                const match = line.match(/\[(\d+):(\d+\.\d+)\](.*)/);
                if (match) {
                    const minutes = parseInt(match[1]);
                    const seconds = parseFloat(match[2]);
                    const time = minutes * 60 + seconds;
                    const text = match[3].trim();
                    
                    if (text) {
                        lyricLines.push({
                            time: time,
                            text: text
                        });
                    }
                }
            });
            
            currentLyrics = lyricLines;
            
            // 显示歌词
            displayLyrics();
        }
        
        // 显示歌词
        function displayLyrics() {
            if (currentLyrics.length === 0) {
                lyrics.innerHTML = '暂无歌词';
                return;
            }
            
            let lyricsHTML = '';
            currentLyrics.forEach((lyric, index) => {
                const activeClass = index === currentLyricIndex ? 'active' : '';
                lyricsHTML += `<div class="lyrics-line ${activeClass}">${lyric.text}</div>`;
            });
            
            lyrics.innerHTML = lyricsHTML;
            
            // 滚动到当前歌词
            const activeLine = lyrics.querySelector('.lyrics-line.active');
            if (activeLine) {
                activeLine.scrollIntoView({
                    behavior: 'smooth',
                    block: 'center'
                });
            }
        }
        
        // 更新歌词高亮
        function updateLyrics(time) {
            if (currentLyrics.length === 0) return;
            
            // 找到当前时间对应的歌词
            let newIndex = 0;
            for (let i = 0; i < currentLyrics.length; i++) {
                if (currentLyrics[i].time <= time) {
                    newIndex = i;
                } else {
                    break;
                }
            }
            
            // 如果歌词索引变化，更新显示
            if (newIndex !== currentLyricIndex) {
                currentLyricIndex = newIndex;
                displayLyrics();
            }
        }
        
        // 下载歌曲
        function downloadSong(songData) {
            if (!songData.url) {
                showError('无法获取歌曲下载链接');
                return;
            }
            
            // 创建临时链接
            const a = document.createElement('a');
            a.href = songData.url;
            a.download = `${songData.name} - ${songData.artist}.mp3`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
        
        // 播放/暂停控制
        playBtn.addEventListener('click', () => {
            if (audioPlayer.paused) {
                audioPlayer.play();
                playIcon.className = 'fas fa-pause';
            } else {
                audioPlayer.pause();
                playIcon.className = 'fas fa-play';
            }
        });
        
        // 上一首
        prevBtn.addEventListener('click', () => {
            if (currentSongs.length === 0) return;
            
            let newIndex = currentSongIndex - 1;
            if (newIndex < 0) newIndex = currentSongs.length - 1;
            
            // 更新激活的歌曲
            document.querySelectorAll('.song-item').forEach(item => {
                item.classList.remove('active');
            });
            
            document.querySelectorAll('.song-item')[newIndex].classList.add('active');
            
            // 播放歌曲
            playSong(currentSongs[newIndex], newIndex);
        });
        
        // 下一首
        nextBtn.addEventListener('click', () => {
            if (currentSongs.length === 0) return;
            
            let newIndex = currentSongIndex + 1;
            if (newIndex >= currentSongs.length) newIndex = 0;
            
            // 更新激活的歌曲
            document.querySelectorAll('.song-item').forEach(item => {
                item.classList.remove('active');
            });
            
            document.querySelectorAll('.song-item')[newIndex].classList.add('active');
            
            // 播放歌曲
            playSong(currentSongs[newIndex], newIndex);
        });
        
        // 进度条控制
        progressBar.addEventListener('click', (e) => {
            if (!audioPlayer.src) return;
            
            const rect = progressBar.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            audioPlayer.currentTime = percent * audioPlayer.duration;
        });
        
        // 音频播放时间更新
        audioPlayer.addEventListener('timeupdate', () => {
            if (!audioPlayer.duration) return;
            
            // 更新进度条
            const percent = (audioPlayer.currentTime / audioPlayer.duration) * 100;
            progress.style.width = `${percent}%`;
            
            // 更新时间显示
            currentTime.textContent = formatTime(audioPlayer.currentTime);
            
            // 更新歌词
            updateLyrics(audioPlayer.currentTime);
        });
        
        // 音频播放结束
        audioPlayer.addEventListener('ended', () => {
            playIcon.className = 'fas fa-play';
            
            // 自动播放下一首
            if (isAutoNext && currentSongs.length > 0) {
                setTimeout(() => {
                    nextBtn.click();
                }, 1000);
            }
        });
        
        // 分页控制
        prevPageBtn.addEventListener('click', () => {
            if (currentPage > 1) {
                searchSongs(searchInput.value.trim(), currentType, currentPage - 1);
            }
        });
        
        nextPageBtn.addEventListener('click', () => {
            if (currentPage < totalPages) {
                searchSongs(searchInput.value.trim(), currentType, currentPage + 1);
            }
        });
        
        // 更新分页状态
        function updatePagination() {
            currentPageSpan.textContent = currentPage;
            prevPageBtn.disabled = currentPage <= 1;
            nextPageBtn.disabled = currentPage >= totalPages;
        }
        
        // 工具函数
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
        
        function getPlatformName(type) {
            const platforms = {
                'wy': '网易云',
                'qq': 'QQ音乐',
                'kw': '酷我音乐',
                'mg': '咪咕音乐',
                'qi': '其他'
            };
            return platforms[type] || type;
        }
        
        function showLoading() {
            loading.classList.add('active');
            resultsSection.style.opacity = '0.5';
        }
        
        function hideLoading() {
            loading.classList.remove('active');
            resultsSection.style.opacity = '1';
        }
        
        function showError(message) {
            errorText.textContent = message;
            errorMessage.classList.add('active');
        }
        
        function hideError() {
            errorMessage.classList.remove('active');
        }
        
        function showNoResults() {
            songList.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-search"></i>
                    <p>未找到相关歌曲，请尝试其他关键词</p>
                </div>
            `;
            pagination.style.display = 'none';
        }
        
        // 初始化：搜索示例歌曲
        window.addEventListener('DOMContentLoaded', () => {
            searchInput.value = '左肩';
            searchSongs('左肩', 'wy', 1);
        });
    </script>
</body>
</html>
