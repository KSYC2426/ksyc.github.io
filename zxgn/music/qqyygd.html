<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QQ音乐歌单查询</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        body {
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #31c27c;
            margin-bottom: 20px;
        }
        .search-box {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }
        .search-box input {
            width: 300px;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 4px 0 0 4px;
            font-size: 16px;
            outline: none;
        }
        .search-box button {
            padding: 10px 20px;
            background-color: #31c27c;
            color: white;
            border: none;
            border-radius: 0 4px 4px 0;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        .search-box button:hover {
            background-color: #2aad6d;
        }
        .user-info {
            text-align: center;
            margin-bottom: 20px;
            padding: 15px;
            background-color: #f9f9f9;
            border-radius: 4px;
        }
        .playlists {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .playlist {
            background-color: #fff;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
            cursor: pointer;
        }
        .playlist:hover {
            transform: translateY(-5px);
        }
        .playlist-cover {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }
        .playlist-info {
            padding: 10px;
        }
        .playlist-name {
            font-weight: bold;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .playlist-count {
            color: #888;
            font-size: 14px;
        }
        .songs-list {
            display: none;
            margin-top: 20px;
        }
        .songs-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .songs-actions {
            display: flex;
            gap: 10px;
        }
        .action-btn {
            padding: 8px 15px;
            background-color: #31c27c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s;
        }
        .action-btn:hover {
            background-color: #2aad6d;
        }
        .action-btn.secondary {
            background-color: #f5f5f5;
            color: #333;
        }
        .song {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }
        .song:hover {
            background-color: #f5f5f5;
        }
        .song-checkbox {
            margin-right: 10px;
        }
        .song-number {
            width: 30px;
            color: #888;
        }
        .song-info {
            flex: 1;
        }
        .song-title {
            font-weight: bold;
        }
        .song-singer {
            color: #888;
            font-size: 14px;
        }
        .player-container {
            display: none;
            margin-top: 30px;
        }
        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .player-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .player-cover {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            animation: rotate 20s linear infinite;
            animation-play-state: paused;
        }
        .player-cover.playing {
            animation-play-state: running;
        }
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .player-info {
            margin-bottom: 20px;
        }
        .player-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .player-singer {
            color: #888;
            font-size: 16px;
        }
        .player-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        .control-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #31c27c;
            transition: color 0.3s;
        }
        .control-btn:hover {
            color: #2aad6d;
        }
        .control-btn.play-pause {
            font-size: 36px;
        }
        audio {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }
        .back-btn {
            display: inline-block;
            margin: 10px 0;
            padding: 8px 15px;
            background-color: #f5f5f5;
            color: #333;
            text-decoration: none;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        .back-btn:hover {
            background-color: #eee;
        }
        .loading {
            text-align: center;
            padding: 20px;
            display: none;
        }
        .loading-spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            border-top: 4px solid #31c27c;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error {
            color: #ff4d4f;
            text-align: center;
            padding: 20px;
            display: none;
        }
        .download-progress {
            margin-top: 20px;
            display: none;
        }
        .progress-bar {
            width: 100%;
            height: 10px;
            background-color: #f0f0f0;
            border-radius: 5px;
            margin-bottom: 10px;
            overflow: hidden;
        }
        .progress {
            height: 100%;
            background-color: #31c27c;
            width: 0%;
            transition: width 0.3s;
        }
        .progress-text {
            text-align: center;
            font-size: 14px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>QQ音乐歌单查询</h1>
        
        <div class="search-box">
            <input type="text" id="qq-input" placeholder="请输入QQ号" value="">
            <button id="search-btn">查询歌单</button>
        </div>
        
        <div class="loading">
            <div class="loading-spinner"></div>
            <p>加载中...</p>
        </div>
        
        <div class="error"></div>
        
        <div class="user-info" id="user-info" style="display: none;">
            <h2 id="username"></h2>
            <p>共有 <span id="playlist-count"></span> 个歌单</p>
        </div>
        
        <div class="playlists" id="playlists"></div>
        
        <div class="songs-list" id="songs-list">
            <a href="#" class="back-btn" id="back-to-playlists">← 返回歌单列表</a>
            <div class="songs-header">
                <h2 id="playlist-title"></h2>
                <div class="songs-actions">
                    <button class="action-btn" id="play-all-btn">播放全部</button>
                    <button class="action-btn secondary" id="select-all-btn">全选</button>
                    <button class="action-btn secondary" id="download-btn">下载选中</button>
                </div>
            </div>
            <div id="songs-container"></div>
        </div>
        
        <div class="player-container" id="player-container">
            <div class="player-header">
                <a href="#" class="back-btn" id="back-to-songs">← 返回歌曲列表</a>
            </div>
            <div class="player-content">
                <img src="" alt="封面" class="player-cover" id="player-cover">
                <div class="player-info">
                    <div class="player-title" id="player-title"></div>
                    <div class="player-singer" id="player-singer"></div>
                </div>
                <div class="player-controls">
                    <button class="control-btn" id="prev-btn">⏮</button>
                    <button class="control-btn play-pause" id="play-pause-btn">▶</button>
                    <button class="control-btn" id="next-btn">⏭</button>
                </div>
                <audio controls id="audio-player"></audio>
            </div>
            <div class="download-progress" id="download-progress">
                <div class="progress-bar">
                    <div class="progress" id="progress-bar"></div>
                </div>
                <div class="progress-text" id="progress-text"></div>
            </div>
        </div>
    </div>

    <script>
        // 获取DOM元素
        const qqInput = document.getElementById('qq-input');
        const searchBtn = document.getElementById('search-btn');
        const loading = document.querySelector('.loading');
        const error = document.querySelector('.error');
        const userInfo = document.getElementById('user-info');
        const username = document.getElementById('username');
        const playlistCount = document.getElementById('playlist-count');
        const playlistsContainer = document.getElementById('playlists');
        const songsList = document.getElementById('songs-list');
        const playlistTitle = document.getElementById('playlist-title');
        const songsContainer = document.getElementById('songs-container');
        const playerContainer = document.getElementById('player-container');
        const playerCover = document.getElementById('player-cover');
        const playerTitle = document.getElementById('player-title');
        const playerSinger = document.getElementById('player-singer');
        const audioPlayer = document.getElementById('audio-player');
        const backToPlaylistsBtn = document.getElementById('back-to-playlists');
        const backToSongsBtn = document.getElementById('back-to-songs');
        const playAllBtn = document.getElementById('play-all-btn');
        const selectAllBtn = document.getElementById('select-all-btn');
        const downloadBtn = document.getElementById('download-btn');
        const prevBtn = document.getElementById('prev-btn');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const nextBtn = document.getElementById('next-btn');
        const downloadProgress = document.getElementById('download-progress');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        
        // 当前状态
        let currentPlaylistId = null;
        let currentSongs = [];
        let currentSongIndex = -1;
        let selectedSongs = [];
        let isPlayingAll = false;
        let downloadQueue = [];
        let downloadedCount = 0;
        
        // 查询歌单
        searchBtn.addEventListener('click', () => {
            const qq = qqInput.value.trim();
            if (!qq) {
                showError('请输入QQ号');
                return;
            }
            
            fetchPlaylists(qq);
        });
        
        // 返回歌单列表
        backToPlaylistsBtn.addEventListener('click', (e) => {
            e.preventDefault();
            songsList.style.display = 'none';
            userInfo.style.display = 'block';
            playlistsContainer.style.display = 'grid';
            resetPlayer();
        });
        
        // 返回歌曲列表
        backToSongsBtn.addEventListener('click', (e) => {
            e.preventDefault();
            playerContainer.style.display = 'none';
            songsList.style.display = 'block';
            resetPlayer();
        });
        
        // 播放全部
        playAllBtn.addEventListener('click', () => {
            if (currentSongs.length === 0) return;
            
            isPlayingAll = true;
            currentSongIndex = 0;
            playSong(currentSongs[currentSongIndex]);
        });
        
        // 全选/取消全选
        selectAllBtn.addEventListener('click', () => {
            const checkboxes = document.querySelectorAll('.song-checkbox');
            const allChecked = Array.from(checkboxes).every(checkbox => checkbox.checked);
            
            checkboxes.forEach(checkbox => {
                checkbox.checked = !allChecked;
            });
            
            selectAllBtn.textContent = allChecked ? '全选' : '取消全选';
            updateSelectedSongs();
        });
        
        // 下载选中歌曲
        downloadBtn.addEventListener('click', () => {
            if (selectedSongs.length === 0) {
                alert('请先选择要下载的歌曲');
                return;
            }
            
            if (confirm(`确定要下载选中的 ${selectedSongs.length} 首歌曲吗？`)) {
                downloadQueue = [...selectedSongs];
                downloadedCount = 0;
                downloadProgress.style.display = 'block';
                downloadNextSong();
            }
        });
        
        // 上一首
        prevBtn.addEventListener('click', () => {
            if (currentSongIndex > 0) {
                currentSongIndex--;
                playSong(currentSongs[currentSongIndex]);
            }
        });
        
        // 播放/暂停
        playPauseBtn.addEventListener('click', () => {
            if (audioPlayer.paused) {
                audioPlayer.play();
                playPauseBtn.textContent = '⏸';
            } else {
                audioPlayer.pause();
                playPauseBtn.textContent = '▶';
            }
        });
        
        // 下一首
        nextBtn.addEventListener('click', () => {
            if (currentSongIndex < currentSongs.length - 1) {
                currentSongIndex++;
                playSong(currentSongs[currentSongIndex]);
            }
        });
        
        // 显示错误信息
        function showError(message) {
            error.textContent = message;
            error.style.display = 'block';
            loading.style.display = 'none';
            userInfo.style.display = 'none';
            playlistsContainer.style.display = 'none';
            songsList.style.display = 'none';
            playerContainer.style.display = 'none';
        }
        
        // 隐藏错误信息
        function hideError() {
            error.style.display = 'none';
        }
        
        // 重置播放器
        function resetPlayer() {
            audioPlayer.pause();
            audioPlayer.src = '';
            playerCover.classList.remove('playing');
            playerCover.src = '';
            playerTitle.textContent = '';
            playerSinger.textContent = '';
            playPauseBtn.textContent = '▶';
            currentSongIndex = -1;
            isPlayingAll = false;
            downloadProgress.style.display = 'none';
        }
        
        // 更新选中的歌曲
        function updateSelectedSongs() {
            const checkboxes = document.querySelectorAll('.song-checkbox:checked');
            selectedSongs = Array.from(checkboxes).map(checkbox => {
                const index = parseInt(checkbox.dataset.index);
                return currentSongs[index];
            });
        }
        
        // 获取歌单列表
        async function fetchPlaylists(qq) {
            hideError();
            loading.style.display = 'block';
            userInfo.style.display = 'none';
            playlistsContainer.style.display = 'none';
            songsList.style.display = 'none';
            playerContainer.style.display = 'none';
            
            try {
                const response = await fetch(`https://api.cenguigui.cn/api/music/qq/user_list.php?qq=${qq}`);
                const data = await response.json();
                
                if (data.code !== 200) {
                    throw new Error(data.msg || '获取歌单失败');
                }
                
                displayUserInfo(data.data);
                displayPlaylists(data.myplaylist);
                
                loading.style.display = 'none';
                userInfo.style.display = 'block';
                playlistsContainer.style.display = 'grid';
            } catch (err) {
                showError(err.message);
            }
        }
        
        // 显示用户信息
        function displayUserInfo(userData) {
            username.textContent = userData.name;
            playlistCount.textContent = userData.totoal;
        }
        
        // 显示歌单列表
        function displayPlaylists(playlists) {
            playlistsContainer.innerHTML = '';
            
            playlists.forEach(playlist => {
                const playlistElement = document.createElement('div');
                playlistElement.className = 'playlist';
                playlistElement.innerHTML = `
                    <img src="${playlist.pic}" alt="${playlist.name}" class="playlist-cover">
                    <div class="playlist-info">
                        <div class="playlist-name">${playlist.name}</div>
                        <div class="playlist-count">${playlist.song_cnt}首</div>
                    </div>
                `;
                
                playlistElement.addEventListener('click', () => {
                    fetchSongs(playlist.id, playlist.name);
                });
                
                playlistsContainer.appendChild(playlistElement);
            });
        }
        
        // 获取歌单中的歌曲
        async function fetchSongs(playlistId, playlistName) {
            loading.style.display = 'block';
            userInfo.style.display = 'none';
            playlistsContainer.style.display = 'none';
            songsList.style.display = 'none';
            playerContainer.style.display = 'none';
            
            try {
                const response = await fetch(`https://www.hhlqilongzhu.cn/api/dg_qqlist_sou.php?List_id=${playlistId}&type=2`);
                const data = await response.json();
                
                if (data.code !== 200) {
                    throw new Error('获取歌曲失败');
                }
                
                currentPlaylistId = playlistId;
                currentSongs = data.data;
                selectedSongs = [];
                
                displaySongs(playlistName, data.data);
                
                loading.style.display = 'none';
                songsList.style.display = 'block';
                selectAllBtn.textContent = '全选';
            } catch (err) {
                showError(err.message);
            }
        }
        
        // 显示歌曲列表
        function displaySongs(playlistName, songs) {
            playlistTitle.textContent = playlistName;
            songsContainer.innerHTML = '';
            
            songs.forEach((song, index) => {
                const songElement = document.createElement('div');
                songElement.className = 'song';
                songElement.innerHTML = `
                    <input type="checkbox" class="song-checkbox" data-index="${index}">
                    <div class="song-number">${index + 1}</div>
                    <div class="song-info">
                        <div class="song-title">${song.title}</div>
                        <div class="song-singer">${song.singer}</div>
                    </div>
                `;
                
                const checkbox = songElement.querySelector('.song-checkbox');
                checkbox.addEventListener('change', () => {
                    updateSelectedSongs();
                    const allChecked = selectedSongs.length === currentSongs.length;
                    selectAllBtn.textContent = allChecked ? '取消全选' : '全选';
                });
                
                songElement.addEventListener('click', (e) => {
                    // 避免点击复选框时触发歌曲播放
                    if (e.target.tagName !== 'INPUT') {
                        isPlayingAll = false;
                        currentSongIndex = index;
                        playSong(song);
                    }
                });
                
                songsContainer.appendChild(songElement);
            });
        }
        
        // 播放歌曲
        async function playSong(song) {
            loading.style.display = 'block';
            songsList.style.display = 'none';
            playerContainer.style.display = 'none';
            
            try {
                const response = await fetch(`https://www.hhlqilongzhu.cn/api/dg_qqlist_sou.php?List_id=${currentPlaylistId}&n=&msg=${encodeURIComponent(song.title)}&n=1`);
                const data = await response.json();
                
                if (data.code !== 200) {
                    throw new Error('获取歌曲信息失败');
                }
                
                displayPlayer(data, song);
                
                loading.style.display = 'none';
                playerContainer.style.display = 'block';
            } catch (err) {
                showError(err.message);
            }
        }
        
        // 显示播放器
        function displayPlayer(songData, song) {
            playerCover.src = songData.song_cover || 'https://y.qq.com/mediastyle/global/img/album_300.png';
            playerTitle.textContent = song.title;
            playerSinger.textContent = song.singer;
            
            audioPlayer.src = songData.song_url;
            audioPlayer.load();
            playPauseBtn.textContent = '⏸';
            
            // 开始播放
            audioPlayer.play().then(() => {
                playerCover.classList.add('playing');
            }).catch(err => {
                console.error('播放失败:', err);
            });
            
            // 播放状态变化
            audioPlayer.addEventListener('play', () => {
                playerCover.classList.add('playing');
                playPauseBtn.textContent = '⏸';
            });
            
            audioPlayer.addEventListener('pause', () => {
                playerCover.classList.remove('playing');
                playPauseBtn.textContent = '▶';
            });
            
            // 歌曲结束自动播放下一首
            audioPlayer.addEventListener('ended', () => {
                if (isPlayingAll && currentSongIndex < currentSongs.length - 1) {
                    currentSongIndex++;
                    playSong(currentSongs[currentSongIndex]);
                }
            });
        }
        
        // 下载下一首歌曲
        function downloadNextSong() {
            if (downloadQueue.length === 0) {
                progressText.textContent = `下载完成 (${downloadedCount}/${downloadedCount})`;
                return;
            }
            
            const song = downloadQueue.shift();
            const fileName = `${song.title.replace(/[\\/:*?"<>|]/g, '')}-${song.singer.replace(/[\\/:*?"<>|]/g, '')}.mp3`;
            
            progressText.textContent = `正在下载: ${fileName} (${downloadedCount + 1}/${downloadedCount + downloadQueue.length + 1})`;
            progressBar.style.width = `${(downloadedCount * 100) / (downloadedCount + downloadQueue.length + 1)}%`;
            
            fetch(`https://www.hhlqilongzhu.cn/api/dg_qqlist_sou.php?List_id=${currentPlaylistId}&n=&msg=${encodeURIComponent(song.title)}&n=1`)
                .then(response => response.json())
                .then(data => {
                    if (data.code === 200 && data.song_url) {
                        return fetch(data.song_url);
                    } else {
                        throw new Error('获取下载链接失败');
                    }
                })
                .then(response => response.blob())
                .then(blob => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = fileName;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    
                    downloadedCount++;
                    progressBar.style.width = `${(downloadedCount * 100) / (downloadedCount + downloadQueue.length)}%`;
                    progressText.textContent = `正在下载: ${fileName} (${downloadedCount}/${downloadedCount + downloadQueue.length})`;
                    
                    // 继续下载下一首
                    setTimeout(downloadNextSong, 500);
                })
                .catch(err => {
                    console.error('下载失败:', err);
                    progressText.textContent = `下载失败: ${fileName} (${downloadedCount + 1}/${downloadedCount + downloadQueue.length + 1})`;
                    // 继续下载下一首
                    setTimeout(downloadNextSong, 500);
                });
        }
    </script>
</body>
</html>
